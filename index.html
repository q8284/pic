<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>免费图床</title>
  <meta name="description" content="基于腾讯云 EdgeOne 边缘网络的免费图床。上传图片自动转换为 WebP 格式，秒级返回直链，支持拖拽上传。" />
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const isDark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
    })();
  </script>
  <style>
    :root, :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f8fafc;
      --bg-gradient: radial-gradient(circle at top left, rgba(15,118,110,0.08), transparent 42%), radial-gradient(circle at right 20%, rgba(2,132,199,0.06), transparent 38%), linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%);
      --panel: rgba(255,255,255,0.85);
      --panel-border: rgba(15,23,42,0.06);
      --text: #0f172a;
      --text-muted: #475569;
      --text-faint: #64748b;
      --primary: #0f766e;
      --primary-hover: #0d9488;
      --primary-strong: #115e59;
      --primary-glow: rgba(15,118,110,0.15);
      --accent: #0891b2;
      --shadow: 0 20px 50px rgba(15,23,42,0.05);
      --card-shadow: 0 4px 20px rgba(15,23,42,0.03);
      --input-bg: #ffffff;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0f19;
      --bg-gradient: radial-gradient(circle at top left, rgba(20,184,166,0.12), transparent 45%), radial-gradient(circle at right 20%, rgba(14,165,233,0.08), transparent 42%), linear-gradient(180deg, #0b0f19 0%, #030712 100%);
      --panel: rgba(17,24,39,0.7);
      --panel-border: rgba(255,255,255,0.06);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --primary: #14b8a6;
      --primary-hover: #2dd4bf;
      --primary-strong: #99f6e4;
      --primary-glow: rgba(20,184,166,0.25);
      --accent: #38bdf8;
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
      --card-shadow: 0 4px 20px rgba(0,0,0,0.25);
      --input-bg: #1e293b;
      --code-bg: #020617;
      --code-text: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; font-family: "Inter", system-ui, sans-serif; color: var(--text); background: var(--bg); background-image: var(--bg-gradient); background-attachment: fixed; transition: background 0.3s, color 0.3s; line-height: 1.6; }
    .shell { width: min(1080px, calc(100vw - 32px)); margin: 0 auto; padding: 24px 0 48px; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .eyebrow { display: inline-flex; padding: 6px 12px; border-radius: 999px; font-family: "Outfit", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary-strong); background: var(--primary-glow); border: 1px solid var(--panel-border); }
    .icon-btn { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--panel-border); background: var(--panel); cursor: pointer; color: var(--text); transition: all 0.2s; }
    .icon-btn:hover { transform: translateY(-2px); }
    .icon-btn svg { position: absolute; inset: 0; margin: auto; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: opacity 0.25s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .icon-btn .sun-icon { opacity: 0; transform: rotate(-90deg) scale(0.4); }
    .icon-btn .moon-icon { opacity: 0; transform: rotate(90deg) scale(0.4); }
    :root[data-theme="light"] .icon-btn .moon-icon { opacity: 1; transform: rotate(0deg) scale(1); }
    :root[data-theme="dark"] .icon-btn .sun-icon { opacity: 1; transform: rotate(0deg) scale(1); }
    :root:not([data-theme]) .icon-btn .moon-icon { opacity: 1; transform: rotate(0deg) scale(1); }

    .hero { padding: 36px 32px; border: 1px solid var(--panel-border); border-radius: 24px; background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(16px); margin-bottom: 22px; }
    h1 { font-family: "Outfit", sans-serif; font-weight: 800; font-size: clamp(26px, 4vw, 42px); background: linear-gradient(120deg, var(--text) 0%, var(--primary) 60%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .lead { color: var(--text-muted); font-size: 15px; }

    .upload-card { padding: 24px; border: 1px solid var(--panel-border); border-radius: 20px; background: var(--panel); box-shadow: var(--card-shadow); margin-bottom: 22px; }
    .drop-zone { border: 2px dashed var(--primary); border-radius: 16px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s; position: relative; }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--primary-glow); }
    .drop-zone svg { width: 48px; height: 48px; stroke: var(--primary); margin-bottom: 12px; }
    .drop-zone p { color: var(--text-muted); font-size: 14px; }
    .drop-zone .hint { font-size: 12px; color: var(--text-faint); margin-top: 8px; }
    #fileInput { display: none; }

    .quality-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    .quality-row label { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
    .quality-row input[type="range"] { flex: 1; accent-color: var(--primary); }
    .quality-row span { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--primary); min-width: 40px; text-align: center; }

    .upload-btn { display: block; width: 100%; padding: 14px; margin-top: 16px; border: 0; border-radius: 12px; font-family: "Outfit", sans-serif; font-weight: 700; font-size: 15px; color: #fff; background: linear-gradient(135deg, var(--primary), var(--accent)); cursor: pointer; transition: all 0.2s; }
    .upload-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .progress-bar { height: 6px; background: var(--panel-border); border-radius: 3px; margin-top: 16px; overflow: hidden; display: none; }
    .progress-bar.show { display: block; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: width 0.3s; }

    .warn-banner { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: rgba(245,158,11,0.1); color: #d97706; font-size: 12px; display: none; }
    .warn-banner.show { display: block; }

    .result-card { padding: 24px; border: 1px solid var(--panel-border); border-radius: 20px; background: var(--panel); box-shadow: var(--card-shadow); margin-bottom: 22px; display: none; }
    .result-card.show { display: block; }
    .result-card h3 { font-family: "Outfit", sans-serif; font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .result-card h3 .ok { color: #059669; }
    .preview-img { max-width: 100%; max-height: 300px; border-radius: 12px; border: 1px solid var(--panel-border); margin-bottom: 16px; display: block; }
    .field-label { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .url-row { display: flex; gap: 8px; align-items: center; }
    .url-row code { flex: 1; font-family: "JetBrains Mono", monospace; font-size: 12px; background: var(--code-bg); color: #7ee787; padding: 10px 14px; border-radius: 8px; overflow-x: auto; white-space: nowrap; }
    .copy-btn { flex-shrink: 0; padding: 10px 18px; border-radius: 8px; border: 0; font-family: "Outfit", sans-serif; font-weight: 600; font-size: 13px; color: #fff; background: linear-gradient(135deg, var(--primary), var(--accent)); cursor: pointer; transition: all 0.2s; }
    .copy-btn.copied { background: linear-gradient(135deg, #059669, #10b981); }

    .history-card { padding: 24px; border: 1px solid var(--panel-border); border-radius: 20px; background: var(--panel); box-shadow: var(--card-shadow); }
    .history-card h3 { font-family: "Outfit", sans-serif; font-size: 16px; margin-bottom: 12px; }
    .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .history-item { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--panel-border); }
    .history-item img { width: 100%; height: 80px; object-fit: cover; display: block; }
    .history-item .copy-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; cursor: pointer; }
    .history-item:hover .copy-overlay { opacity: 1; }
    .history-item .copy-overlay span { color: #fff; font-size: 12px; font-weight: 600; }

    .footer { margin-top: 32px; text-align: center; color: var(--text-muted); font-size: 13px; }

    @media (max-width: 720px) {
      .hero { padding: 26px 22px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2z" />
          <path d="M8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" />
        </svg>
        <span class="eyebrow">Free Image Bed</span>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="切换主题" title="单击切换日间夜间模式，双击恢复跟随系统">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </header>

    <main>
      <section class="hero">
        <h1>免费图床</h1>
        <p class="lead">基于腾讯云 EdgeOne 边缘网络的免费图床。上传图片自动转换为 WebP 格式，秒级返回直链，支持拖拽上传。</p>
      </section>

      <section class="upload-card">
        <div class="drop-zone" id="dropZone">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
            <path d="M14 13V17H10V13H7L12 8L17 13H14M19.35 10.03C18.67 6.59 15.64 4 12 4C9.11 4 6.6 5.64 5.35 8.03C2.34 8.36 0 10.9 0 14A6 6 0 0 0 6 20H19A5 5 0 0 0 24 15C24 12.36 21.95 10.22 19.35 10.03Z" />
          </svg>
          <p>拖拽图片到此处，或点击选择</p>
          <p class="hint">支持 JPG / PNG / GIF / WebP · 自动转换为 WebP · 原图最大 10MB</p>
          <input type="file" id="fileInput" accept="image/*" multiple />
        </div>
        <div class="quality-row">
          <label>WebP 质量</label>
          <input type="range" id="quality" min="0.3" max="0.95" step="0.05" value="0.8" />
          <span id="qualityVal">0.80</span>
        </div>
        <div class="warn-banner" id="warnBanner"></div>
        <button class="upload-btn" id="uploadBtn" disabled>上传图片</button>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
      </section>

      <section class="result-card" id="resultCard">
        <h3><span class="ok">上传成功</span></h3>
        <img class="preview-img" id="resultImg" />
        <div style="margin-bottom:12px;">
          <div class="field-label">图片直链</div>
          <div class="url-row"><code id="resultUrl"></code><button class="copy-btn" id="copyUrlBtn">复制</button></div>
        </div>
      </section>

      <section class="history-card">
        <h3>最近上传</h3>
        <div class="history-grid" id="historyGrid">
          <p style="color:var(--text-faint);font-size:13px;">暂无记录</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Powered by Tencent Cloud EdgeOne · 图片自动转 WebP · 边缘存储</p>
    </footer>
  </div>

  <script>
    const themeToggle = document.getElementById("themeToggle");
    const prefersDarkQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
    }

    function systemTheme() {
      return prefersDarkQuery.matches ? "dark" : "light";
    }

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      const next = current === "dark" ? "light" : "dark";
      applyTheme(next);
      localStorage.setItem("theme", next);
    });

    themeToggle.addEventListener("dblclick", (e) => {
      e.preventDefault();
      localStorage.removeItem("theme");
      applyTheme(systemTheme());
    });

    const onSystemThemeChange = (e) => {
      if (!localStorage.getItem("theme")) applyTheme(e.matches ? "dark" : "light");
    };
    if (prefersDarkQuery.addEventListener) prefersDarkQuery.addEventListener("change", onSystemThemeChange);
    else if (prefersDarkQuery.addListener) prefersDarkQuery.addListener(onSystemThemeChange);

    const qualitySlider = document.getElementById("quality");
    const qualityVal = document.getElementById("qualityVal");
    qualitySlider.addEventListener("input", () => { qualityVal.textContent = parseFloat(qualitySlider.value).toFixed(2); });

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const warnBanner = document.getElementById("warnBanner");
    const MAX_ORIGINAL_SIZE = 10 * 1024 * 1024;
    let selectedFiles = [];

    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", (e) => handleFiles(e.target.files));

    function handleFiles(files) {
      selectedFiles = Array.from(files).filter(f => f.type.startsWith("image/"));
      const oversized = selectedFiles.filter(f => f.size > MAX_ORIGINAL_SIZE);
      if (oversized.length > 0) {
        warnBanner.className = "warn-banner show";
        warnBanner.textContent = oversized.length + " 张图片超过 10MB 限制，已自动过滤";
        selectedFiles = selectedFiles.filter(f => f.size <= MAX_ORIGINAL_SIZE);
      } else {
        warnBanner.className = "warn-banner";
      }
      if (selectedFiles.length === 0) { uploadBtn.disabled = true; return; }
      dropZone.querySelector("p").textContent = "已选择 " + selectedFiles.length + " 张图片";
      uploadBtn.disabled = false;
    }

    uploadBtn.addEventListener("click", async () => {
      if (selectedFiles.length === 0) return;
      uploadBtn.disabled = true;
      uploadBtn.textContent = "处理中...";
      const progressBar = document.getElementById("progressBar");
      const progressFill = document.getElementById("progressFill");
      progressBar.classList.add("show");
      progressFill.style.width = "0%";
      warnBanner.className = "warn-banner";

      const quality = parseFloat(qualitySlider.value);
      const uploadedResults = [];

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        try {
          const webpBlob = await convertToWebP(file, quality);
          progressFill.style.width = ((i + 0.5) / selectedFiles.length) * 100 + "%";

          const formData = new FormData();
          formData.append("file", webpBlob, file.name.replace(/\.[^.]+$/, ".webp"));

          const resp = await fetch("/upload", { method: "POST", body: formData });
          const data = await resp.json();

          if (data.success) {
            uploadedResults.push(data.data);
            saveToHistory(data.data);
          } else {
            alert(file.name + " 上传失败: " + data.error);
          }
        } catch (e) {
          console.error(e);
          alert(file.name + " 处理失败");
        }
        progressFill.style.width = ((i + 1) / selectedFiles.length) * 100 + "%";
      }

      if (uploadedResults.length > 0) {
        showResult(uploadedResults[uploadedResults.length - 1]);
      }

      uploadBtn.textContent = "上传图片";
      uploadBtn.disabled = false;
      fileInput.value = "";
      selectedFiles = [];
      dropZone.querySelector("p").textContent = "拖拽图片到此处，或点击选择";
    });

    function convertToWebP(file, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0);
          canvas.toBlob(blob => {
            if (blob) resolve(blob);
            else reject(new Error("WebP conversion failed"));
          }, "image/webp", quality);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    function showResult(data) {
      document.getElementById("resultCard").classList.add("show");
      document.getElementById("resultImg").src = data.url;
      document.getElementById("resultUrl").textContent = data.url;
    }

    document.getElementById("copyUrlBtn").addEventListener("click", () => {
      const text = document.getElementById("resultUrl").textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("copyUrlBtn");
        btn.classList.add("copied");
        btn.textContent = "已复制";
        setTimeout(() => { btn.classList.remove("copied"); btn.textContent = "复制"; }, 1500);
      });
    });

    function saveToHistory(data) {
      const history = JSON.parse(localStorage.getItem("uploadHistory") || "[]");
      history.unshift({ url: data.url, filename: data.filename });
      localStorage.setItem("uploadHistory", JSON.stringify(history.slice(0, 20)));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem("uploadHistory") || "[]");
      const grid = document.getElementById("historyGrid");
      if (history.length === 0) { grid.innerHTML = "<p style=\"color:var(--text-faint);font-size:13px;\">暂无记录</p>"; return; }
      grid.innerHTML = history.map(h => `
        <div class="history-item">
          <img src="${h.url}" loading="lazy" />
          <div class="copy-overlay" onclick="navigator.clipboard.writeText('${h.url}').then(()=>{this.querySelector('span').textContent='已复制';setTimeout(()=>{this.querySelector('span').textContent='复制链接'},1500)})">
            <span>复制链接</span>
          </div>
        </div>
      `).join("");
    }
    renderHistory();
  </script>
</body>
</html>
