<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>免费图床</title>
  <meta name="description" content="基于腾讯云 EdgeOne 的免费图床。上传图片自动转换为 WebP 格式，秒级返回直链，支持拖拽上传。" />
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const isDark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
    })();
  </script>
  <style>
    :root, :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f8fafc;
      --bg-gradient: radial-gradient(circle at top left, rgba(15,118,110,0.08), transparent 42%), radial-gradient(circle at right 20%, rgba(2,132,199,0.06), transparent 38%), linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%);
      --panel: rgba(255,255,255,0.85);
      --panel-border: rgba(15,23,42,0.06);
      --text: #0f172a;
      --text-muted: #475569;
      --text-faint: #64748b;
      --primary: #0f766e;
      --primary-strong: #115e59;
      --primary-glow: rgba(15,118,110,0.15);
      --accent: #0891b2;
      --shadow: 0 20px 50px rgba(15,23,42,0.05);
      --card-shadow: 0 4px 20px rgba(15,23,42,0.03);
      --input-bg: #ffffff;
      --code-bg: #0f172a;
      --warn-bg: rgba(245,158,11,0.1);
      --warn-text: #d97706;
      --ok: #059669;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0f19;
      --bg-gradient: radial-gradient(circle at top left, rgba(20,184,166,0.12), transparent 45%), radial-gradient(circle at right 20%, rgba(14,165,233,0.08), transparent 42%), linear-gradient(180deg, #0b0f19 0%, #030712 100%);
      --panel: rgba(17,24,39,0.7);
      --panel-border: rgba(255,255,255,0.06);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --primary: #14b8a6;
      --primary-strong: #99f6e4;
      --primary-glow: rgba(20,184,166,0.25);
      --accent: #38bdf8;
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
      --card-shadow: 0 4px 20px rgba(0,0,0,0.25);
      --input-bg: #1e293b;
      --code-bg: #020617;
      --warn-bg: rgba(245,158,11,0.15);
      --warn-text: #fbbf24;
      --ok: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; font-family: "Inter", system-ui, sans-serif; color: var(--text); background: var(--bg); background-image: var(--bg-gradient); background-attachment: fixed; transition: background 0.3s, color 0.3s; line-height: 1.6; touch-action: manipulation; }
    button, .drop-zone, .history-item, .copy-btn, .upload-btn { touch-action: manipulation; }
    .shell { width: min(1080px, calc(100vw - 32px)); margin: 0 auto; padding: 24px 0 48px; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .eyebrow { display: inline-flex; padding: 6px 12px; border-radius: 999px; font-family: "Outfit", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary-strong); background: var(--primary-glow); border: 1px solid var(--panel-border); }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .gh-link {
      display: inline-flex; align-items: center; justify-content: center; height: 40px; border-radius: 12px; border: 1px solid var(--panel-border); background: var(--panel); color: var(--text); cursor: pointer; box-shadow: var(--card-shadow); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none; padding: 0 14px; font-size: 13px; font-weight: 600; font-family: 'Outfit', sans-serif; gap: 8px;
    }
    .gh-link:hover { background: var(--input-bg); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08); }
    .gh-link:active { transform: scale(0.96); }
    .gh-link svg { fill: currentColor; stroke: none; width: 16px; height: 16px; }

    .icon-btn { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--panel-border); background: var(--panel); cursor: pointer; color: var(--text); transition: background 0.2s, transform 0.2s; flex-shrink: 0; }
    .icon-btn:hover { background: var(--input-bg); transform: translateY(-2px); }
    .icon-btn svg { position: absolute; inset: 0; margin: auto; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: opacity 0.25s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .icon-btn .sun-icon { opacity: 0; transform: rotate(-90deg) scale(0.4); }
    .icon-btn .moon-icon { opacity: 0; transform: rotate(90deg) scale(0.4); }
    :root[data-theme="light"] .icon-btn .moon-icon { opacity: 1; transform: rotate(0deg) scale(1); }
    :root[data-theme="dark"] .icon-btn .sun-icon { opacity: 1; transform: rotate(0deg) scale(1); }
    :root:not([data-theme]) .icon-btn .moon-icon { opacity: 1; transform: rotate(0deg) scale(1); }

    .hero { padding: 36px 32px; border: 1px solid var(--panel-border); border-radius: 24px; background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(16px); margin-bottom: 22px; }
    h1 { font-family: "Outfit", sans-serif; font-weight: 800; font-size: clamp(26px, 4vw, 42px); background: linear-gradient(120deg, var(--text) 0%, var(--primary) 60%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .lead { color: var(--text-muted); font-size: 15px; }

    .codec-tag { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 5px 12px; border-radius: 999px; font-size: 11.5px; font-family: "JetBrains Mono", monospace; background: var(--panel-border); color: var(--text-muted); }
    .codec-tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); display: block; }
    .codec-tag.ready i { background: var(--ok); }
    .codec-tag.fail i { background: var(--warn-text); }

    .upload-card { padding: 24px; border: 1px solid var(--panel-border); border-radius: 20px; background: var(--panel); box-shadow: var(--card-shadow); margin-bottom: 22px; }
    .drop-zone { border: 2px dashed var(--primary); border-radius: 16px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s; position: relative; }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--primary-glow); }
    .drop-zone svg { width: 48px; height: 48px; stroke: var(--primary); margin-bottom: 12px; }
    .drop-zone p { color: var(--text-muted); font-size: 14px; }
    .drop-zone .hint { font-size: 12px; color: var(--text-faint); margin-top: 8px; }
    #fileInput { display: none; }

    .row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    .row label { font-size: 13px; color: var(--text-muted); white-space: nowrap; min-width: 60px; }
    .row input[type="range"] { flex: 1; accent-color: var(--primary); }
    .row span { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--primary); min-width: 40px; text-align: center; }

    .upload-btn { display: block; width: 100%; padding: 14px; margin-top: 16px; border: 0; border-radius: 12px; font-family: "Outfit", sans-serif; font-weight: 700; font-size: 15px; color: #fff; background: linear-gradient(135deg, var(--primary), var(--accent)); cursor: pointer; transition: all 0.2s; }
    .upload-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .progress-bar { height: 6px; background: var(--panel-border); border-radius: 3px; margin-top: 16px; overflow: hidden; display: none; }
    .progress-bar.show { display: block; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: width 0.3s; }

    .warn-banner { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-text); font-size: 12px; display: none; }
    .warn-banner.show { display: block; }

    .result-card { padding: 24px; border: 1px solid var(--panel-border); border-radius: 20px; background: var(--panel); box-shadow: var(--card-shadow); margin-bottom: 22px; display: none; }
    .result-card.show { display: block; }
    .result-card h3 { font-family: "Outfit", sans-serif; font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .result-card h3 .ok { color: var(--ok); }
    .preview-img { max-width: 100%; max-height: 300px; border-radius: 12px; border: 1px solid var(--panel-border); margin-bottom: 12px; display: block; }
    .compress-info { font-size: 12.5px; color: var(--text-muted); font-family: "JetBrains Mono", monospace; margin-bottom: 14px; }
    .compress-info b { color: var(--ok); font-weight: 600; }
    .url-row { display: flex; gap: 8px; align-items: center; }
    .url-row code { flex: 1; font-family: "JetBrains Mono", monospace; font-size: 12px; background: var(--code-bg); color: #7ee787; padding: 10px 14px; border-radius: 8px; overflow-x: auto; white-space: nowrap; }
    .copy-btn { flex-shrink: 0; padding: 10px 18px; border-radius: 8px; border: 0; font-family: "Outfit", sans-serif; font-weight: 600; font-size: 13px; color: #fff; background: linear-gradient(135deg, var(--primary), var(--accent)); cursor: pointer; transition: all 0.2s; }
    .copy-btn.copied { background: linear-gradient(135deg, #059669, #10b981); }

    .history-card { padding: 24px; border: 1px solid var(--panel-border); border-radius: 20px; background: var(--panel); box-shadow: var(--card-shadow); }
    .history-card h3 { font-family: "Outfit", sans-serif; font-size: 16px; margin-bottom: 12px; }
    .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .history-item { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--panel-border); }
    .history-item img { width: 100%; height: 80px; object-fit: cover; display: block; }
    .history-item .copy-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; cursor: pointer; }
    .history-item:hover .copy-overlay { opacity: 1; }
    .history-item .copy-overlay span { color: #fff; font-size: 12px; font-weight: 600; }

    .footer { margin-top: 32px; padding: 22px 16px; text-align: center; color: var(--text-muted); font-size: 13.5px; line-height: 1.9; }
    .footer > div { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .footer svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--primary); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .footer svg[data-solid="true"] { fill: currentColor; stroke: none; }
    .footer a { color: var(--primary); text-decoration: none; border-bottom: 1px solid var(--primary-glow); transition: color 0.2s ease, border-bottom-color 0.2s ease; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
    .footer a:hover { color: var(--primary-hover); border-bottom-color: var(--primary); }
    .footer .dot { display: inline-block; opacity: 0.5; }

    @media (max-width: 720px) {
      .hero { padding: 26px 22px; }
      .gh-link span { display: none; }
      .gh-link { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand">

        <span class="eyebrow">Free Image Bed</span>
      </div>
      <div class="header-actions">
        <a href="https://github.com/q8284/pic" target="_blank" rel="noopener noreferrer" class="gh-link" aria-label="GitHub">
          <svg viewBox="0 0 16 16" aria-hidden="true">

            <line x1="1" y1="12" x2="3" y2="12" />

            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1>免费图床</h1>
        <p class="lead">基于腾讯云 EdgeOne 的免费图床。上传图片自动转换为 WebP 格式，秒级返回直链，支持拖拽上传。</p>
        <div class="codec-tag" id="codecTag"><i></i><span id="codecText">检测编码器中</span></div>
      </section>

      <section class="upload-card">
        <div class="drop-zone" id="dropZone">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M14 13V17H10V13H7L12 8L17 13H14M19.35 10.03C18.67 6.59 15.64 4 12 4C9.11 4 6.6 5.64 5.35 8.03C2.34 8.36 0 10.9 0 14A6 6 0 0 0 6 20H19A5 5 0 0 0 24 15C24 12.36 21.95 10.22 19.35 10.03Z"/></svg>
          <p>拖拽图片到此处，或点击选择</p>
          <p class="hint">支持 JPG / PNG / GIF / WebP · 自动转换为 WebP · 原图最大 10MB</p>

        <div class="row">

        <div class="url-row"><code id="resultUrl"></code><button class="copy-btn" id="copyUrlBtn">复制</button></div>
      </section>

      <section class="history-card">
        <h3>最近上传</h3>
        <div class="history-grid" id="historyGrid">

    <footer class="footer">
      <div>
        <svg viewBox="0 0 24 24" aria-hidden="true">

          <path d="M10 22h4"/>

        </svg>
        基于 EdgeOne· 自动适配深色 / 浅色主题
      </div>

        <a href="https://github.com/q8284/pic" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true" data-solid="true">

          </svg>
          反馈问题

      </div>

  <script>
    const MAX_ORIGINAL_SIZE = 10 * 1024 * 1024;
    const CODEC_URL = "https://unpkg.com/@jsquash/webp@1.5.0/index.js?module";

    let webpCodec = null;
    let webpCodecPending = null;

    function setCodecState(state, text) {
      const tag = document.getElementById("codecTag");
      tag.className = "codec-tag" + (state ? " " + state : "");
      document.getElementById("codecText").textContent = text;
    }

    function loadWebpCodec() {
      if (webpCodec) return Promise.resolve(webpCodec);
      if (webpCodecPending) return webpCodecPending;
      webpCodecPending = import(CODEC_URL)
        .then(function (mod) {
          webpCodec = mod;
          setCodecState("ready", "编码器已就绪");
          return mod;
        })
        .catch(function (e) {
          webpCodecPending = null;
          setCodecState("fail", "编码器加载失败");
          throw new Error("编码器加载失败");
        });
      return webpCodecPending;
    }

    function canEncodeNatively() {
      const c = document.createElement("canvas");
      c.width = 2;
      c.height = 2;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "rgba(0,128,255,0.5)";
      ctx.fillRect(0, 0, 2, 2);
      return new Promise(function (resolve) {
        c.toBlob(function (blob) {
          resolve(!!blob && blob.type === "image/webp");
        }, "image/webp", 0.8);
      });
    }

    (async function initCodec() {
      const native = await canEncodeNatively();
      if (native) {
        setCodecState("ready", "浏览器原生编码器");
      } else {
        setCodecState("", "正在加载编码器");
        try {
          await loadWebpCodec();
        } catch (e) {
          setCodecState("fail", "编码器不可用");
        }
      }
    })();

    document.getElementById("themeToggle").addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    });

    const qualitySlider = document.getElementById("quality");
    const qualityVal = document.getElementById("qualityVal");
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const warnBanner = document.getElementById("warnBanner");
    let selectedFiles = [];

    qualitySlider.addEventListener("input", () => {
      qualityVal.textContent = parseFloat(qualitySlider.value).toFixed(2);
    });

    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", (e) => handleFiles(e.target.files));

    function handleFiles(files) {
      selectedFiles = Array.from(files).filter(f => f.type.startsWith("image/"));
      const oversized = selectedFiles.filter(f => f.size > MAX_ORIGINAL_SIZE);
      if (oversized.length > 0) {
        warnBanner.className = "warn-banner show";
        warnBanner.textContent = oversized.length + " 张图片超过 10MB 限制，已自动过滤";
        selectedFiles = selectedFiles.filter(f => f.size <= MAX_ORIGINAL_SIZE);
      } else {
        warnBanner.className = "warn-banner";
      }
      if (selectedFiles.length === 0) { uploadBtn.disabled = true; return; }
      dropZone.querySelector("p").textContent = "已选择 " + selectedFiles.length + " 张图片";
      uploadBtn.disabled = false;
    }

    function drawToCanvas(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const w = img.naturalWidth || img.width;
          const h = img.naturalHeight || img.height;
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas);
        };
        img.onerror = () => reject(new Error("图片解析失败"));
        img.src = URL.createObjectURL(file);
      });
    }

    async function encodeWebp(canvas, quality) {
      const native = await new Promise((resolve) => {
        canvas.toBlob(resolve, "image/webp", quality);
      });
      if (native && native.type === "image/webp") return native;

      const codec = await loadWebpCodec();
      const ctx = canvas.getContext("2d");
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const buffer = await codec.encode(imageData, { quality: Math.round(quality * 100) });
      return new Blob([buffer], { type: "image/webp" });
    }

    function formatSize(bytes) {
      if (!bytes || bytes <= 0) return "—";
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / 1024 / 1024).toFixed(2) + " MB";
    }

    uploadBtn.addEventListener("click", async () => {
      if (selectedFiles.length === 0) return;
      uploadBtn.disabled = true;
      uploadBtn.textContent = "处理中...";
      const progressBar = document.getElementById("progressBar");
      const progressFill = document.getElementById("progressFill");
      progressBar.classList.add("show");
      progressFill.style.width = "0%";
      warnBanner.className = "warn-banner";

      const quality = parseFloat(qualitySlider.value);
      const uploadedResults = [];

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        try {
          const canvas = await drawToCanvas(file);
          const webpBlob = await encodeWebp(canvas, quality);
          progressFill.style.width = ((i + 0.5) / selectedFiles.length) * 100 + "%";

          const formData = new FormData();
          formData.append("file", webpBlob, file.name.replace(/\.[^.]+$/, ".webp"));

          const resp = await fetch("/upload", { method: "POST", body: formData });
          const data = await resp.json();

          if (data.success) {
            uploadedResults.push({
              url: data.data.url,
              originalSize: file.size,
              webpSize: webpBlob.size
            });
            saveToHistory(data.data);
          } else {
            alert(file.name + " 上传失败: " + data.error);
          }
        } catch (e) {
          alert(file.name + " " + (e && e.message ? e.message : "处理失败"));
        }
        progressFill.style.width = ((i + 1) / selectedFiles.length) * 100 + "%";
      }

      if (uploadedResults.length > 0) {
        showResult(uploadedResults[uploadedResults.length - 1]);
      }

      uploadBtn.textContent = "上传图片";
      uploadBtn.disabled = false;
      fileInput.value = "";
      selectedFiles = [];
      dropZone.querySelector("p").textContent = "拖拽图片到此处，或点击选择";
    });

    function showResult(item) {
      document.getElementById("resultCard").classList.add("show");
      document.getElementById("resultImg").src = item.url;
      document.getElementById("resultUrl").textContent = item.url;

      const saved = 100 - Math.round((item.webpSize / item.originalSize) * 100);
      const info = document.getElementById("compressInfo");
      if (saved > 0) {
        info.innerHTML = formatSize(item.originalSize) + " → " + formatSize(item.webpSize) + " · 省 <b>" + saved + "%</b>";
      } else {
        info.innerHTML = formatSize(item.originalSize) + " → " + formatSize(item.webpSize) + " · 增大 " + Math.abs(saved) + "%";
      }
    }

    document.getElementById("copyUrlBtn").addEventListener("click", () => {
      const text = document.getElementById("resultUrl").textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("copyUrlBtn");
        btn.classList.add("copied");
        btn.textContent = "已复制";
        setTimeout(() => { btn.classList.remove("copied"); btn.textContent = "复制"; }, 1500);
      });
    });

    function saveToHistory(data) {
      const history = JSON.parse(localStorage.getItem("uploadHistory") || "[]");
      history.unshift({ url: data.url, filename: data.filename });
      localStorage.setItem("uploadHistory", JSON.stringify(history.slice(0, 20)));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem("uploadHistory") || "[]");
      const grid = document.getElementById("historyGrid");
      if (history.length === 0) { grid.innerHTML = '<p style="color:var(--text-faint);font-size:13px;">暂无记录</p>'; return; }
      grid.innerHTML = history.map(h => `
        <div class="history-item">
          <img src="${h.url}" loading="lazy" />
          <div class="copy-overlay" onclick="navigator.clipboard.writeText('${h.url}').then(()=>{this.querySelector('span').textContent='已复制';setTimeout(()=>{this.querySelector('span').textContent='复制链接'},1500)})">
            <span>复制链接</span>
          </div>
        </div>
      `).join("");
    }
    renderHistory();
  </script>
</body>
</html>
