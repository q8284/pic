<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图床管理</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg width='600' height='600' viewBox='0 0 24 24' aria-hidden='true' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='logoGrad' x1='0' y1='0' x2='24' y2='24' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%2314b8a6'/%3E%3Cstop offset='100%25' stop-color='%230891b2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23logoGrad)' d='M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const isDark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
    })();
  </script>
  <style>
    :root, :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f8fafc;
      --bg-gradient: radial-gradient(circle at top left, rgba(15,118,110,0.08), transparent 42%), radial-gradient(circle at right 20%, rgba(2,132,199,0.06), transparent 38%), linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%);
      --panel: rgba(255,255,255,0.85);
      --panel-border: rgba(15,23,42,0.06);
      --text: #0f172a;
      --text-muted: #475569;
      --text-faint: #64748b;
      --primary: #0f766e;
      --primary-strong: #115e59;
      --primary-glow: rgba(15,118,110,0.15);
      --accent: #0891b2;
      --shadow: 0 20px 50px rgba(15,23,42,0.05);
      --card-shadow: 0 4px 20px rgba(15,23,42,0.03);
      --input-bg: #ffffff;
      --danger: #dc2626;
      --danger-bg: rgba(220,38,38,0.1);
      --danger-glow: rgba(220,38,38,0.15);
      --success: #059669;
      --skeleton: rgba(15,23,42,0.06);
      --hover-bg: #f1f5f9;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0f19;
      --bg-gradient: radial-gradient(circle at top left, rgba(20,184,166,0.12), transparent 45%), radial-gradient(circle at right 20%, rgba(14,165,233,0.08), transparent 42%), linear-gradient(180deg, #0b0f19 0%, #030712 100%);
      --panel: rgba(17,24,39,0.7);
      --panel-border: rgba(255,255,255,0.06);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --primary: #14b8a6;
      --primary-strong: #99f6e4;
      --primary-glow: rgba(20,184,166,0.25);
      --accent: #38bdf8;
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
      --card-shadow: 0 4px 20px rgba(0,0,0,0.25);
      --input-bg: #1e293b;
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.15);
      --danger-glow: rgba(248,113,113,0.25);
      --success: #34d399;
      --skeleton: rgba(255,255,255,0.06);
      --hover-bg: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { min-height: 100vh; font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); background-image: var(--bg-gradient); background-attachment: fixed; -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s; line-height: 1.6; }
    .shell { width: min(1240px, calc(100vw - 32px)); margin: 0 auto; padding: 20px 0 48px; }
    .hidden { display: none !important; }

    .header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--panel-border); }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .brand .logo { width: 26px; height: 26px; display: block; }
    .eyebrow { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 999px; font-family: "Outfit", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary-strong); background: var(--primary-glow); border: 1px solid var(--panel-border); }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .icon-btn { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--panel-border); background: var(--panel); cursor: pointer; color: var(--text); transition: background 0.2s, transform 0.2s; flex-shrink: 0; }
    .icon-btn:hover { background: var(--hover-bg); transform: translateY(-2px); }
    .icon-btn svg { position: absolute; inset: 0; margin: auto; width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: opacity 0.25s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .icon-btn .sun-icon { opacity: 0; transform: rotate(-90deg) scale(0.4); }
    .icon-btn .moon-icon { opacity: 0; transform: rotate(90deg) scale(0.4); }
    :root[data-theme="light"] .icon-btn .moon-icon { opacity: 1; transform: rotate(0deg) scale(1); }
    :root[data-theme="dark"] .icon-btn .sun-icon { opacity: 1; transform: rotate(0deg) scale(1); }
    :root:not([data-theme]) .icon-btn .moon-icon { opacity: 1; transform: rotate(0deg) scale(1); }

    .user-chip { display: flex; align-items: center; gap: 9px; padding: 5px 6px 5px 5px; border: 1px solid var(--panel-border); border-radius: 999px; background: var(--panel); }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; font-family: "Outfit", sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; flex-shrink: 0; }
    .user-name { font-size: 13px; font-weight: 600; padding-right: 6px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 18px; border: 0; border-radius: 10px; font-family: "Outfit", sans-serif; font-weight: 700; font-size: 13.5px; color: #fff; background: linear-gradient(135deg, var(--primary), var(--accent)); box-shadow: 0 6px 18px var(--primary-glow); cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }
    .btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .btn-danger { background: linear-gradient(135deg, #dc2626, #f43f5e); box-shadow: 0 6px 18px var(--danger-glow); }
    .btn-ghost { background: var(--input-bg); color: var(--text); border: 1px solid var(--panel-border); box-shadow: none; font-weight: 600; }
    .btn-ghost:hover { background: var(--hover-bg); filter: none; }
    .btn-icon { padding: 9px; border-radius: 9px; }
    .btn-icon svg { width: 16px; height: 16px; }

    .hero { display: grid; gap: 12px; padding: 36px 32px; border: 1px solid var(--panel-border); border-radius: 24px; background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(16px); margin-bottom: 22px; }
    h1 { font-family: "Outfit", sans-serif; font-weight: 800; font-size: clamp(24px, 4vw, 36px); line-height: 1.15; letter-spacing: -0.03em; background: linear-gradient(120deg, var(--text) 0%, var(--primary) 60%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .lead { color: var(--text-muted); font-size: 15px; line-height: 1.7; max-width: 720px; }

    .login-wrap { display: flex; justify-content: center; padding: 40px 0; }
    .login-card { width: 100%; max-width: 420px; padding: 32px; border: 1px solid var(--panel-border); border-radius: 20px; background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(16px); }
    .login-icon { width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary), var(--accent)); box-shadow: 0 8px 20px var(--primary-glow); }
    .login-icon svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .login-title { font-family: "Outfit", sans-serif; font-weight: 700; font-size: 19px; text-align: center; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: var(--text-faint); text-align: center; margin-bottom: 24px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.02em; }
    .field input { width: 100%; padding: 12px 16px; border: 1px solid var(--panel-border); border-radius: 10px; background: var(--input-bg); color: var(--text); font-family: "Inter", sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .error-banner { margin-top: 14px; padding: 10px 14px; border-radius: 10px; background: var(--danger-bg); color: var(--danger); font-size: 13px; display: none; }
    .error-banner.show { display: block; }

    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 20px; border: 1px solid var(--panel-border); border-bottom: 0; border-radius: 16px 16px 0 0; background: var(--panel); backdrop-filter: blur(16px); }
    .search-box { position: relative; flex: 1; min-width: 200px; }
    .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: none; stroke: var(--text-faint); stroke-width: 2; stroke-linecap: round; }
    .search-box input { width: 100%; padding: 10px 14px 10px 36px; border: 1px solid var(--panel-border); border-radius: 10px; background: var(--input-bg); color: var(--text); font-family: "Inter", sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .toolbar-group { display: flex; align-items: center; gap: 8px; }
    .check-label { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border: 1px solid var(--panel-border); border-radius: 10px; background: var(--input-bg); cursor: pointer; font-size: 13px; font-weight: 500; user-select: none; transition: border-color 0.2s; white-space: nowrap; }
    .check-label:hover { border-color: var(--primary); }
    .check-label input { accent-color: var(--primary); cursor: pointer; width: 15px; height: 15px; }
    .page-size { padding: 9px 12px; border: 1px solid var(--panel-border); border-radius: 10px; background: var(--input-bg); color: var(--text); font-family: "Inter", sans-serif; font-size: 13px; outline: none; cursor: pointer; }
    .page-size:focus { border-color: var(--primary); }
    .stat-line { font-size: 12.5px; color: var(--text-muted); font-family: "JetBrains Mono", monospace; white-space: nowrap; }

    .grid-panel { border: 1px solid var(--panel-border); border-radius: 0 0 16px 16px; background: var(--panel); backdrop-filter: blur(16px); padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
    .item { position: relative; border: 1px solid var(--panel-border); border-radius: 14px; overflow: hidden; background: var(--input-bg); transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; }
    .item:hover { transform: translateY(-3px); box-shadow: 0 10px 24px var(--primary-glow); border-color: var(--primary); }
    .item.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
    .item .check { position: absolute; top: 8px; left: 8px; z-index: 2; width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; opacity: 0; transition: opacity 0.2s; }
    .item:hover .check, .item.selected .check { opacity: 1; }
    .thumb-wrap { position: relative; height: 118px; background: var(--panel-border); overflow: hidden; cursor: pointer; }
    .thumb { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
    .item:hover .thumb { transform: scale(1.06); }
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
    .item:hover .overlay { opacity: 1; }
    .overlay span { color: #fff; font-size: 11.5px; font-weight: 600; padding: 5px 12px; border: 1px solid rgba(255,255,255,0.45); border-radius: 7px; }
    .meta { padding: 10px 11px; }
    .name { font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--text); word-break: break-all; margin-bottom: 5px; line-height: 1.4; }
    .sub { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; color: var(--text-faint); font-family: "JetBrains Mono", monospace; gap: 6px; }
    .actions { display: flex; gap: 6px; padding: 0 11px 11px; }
    .actions button { flex: 1; padding: 6px 8px; border: 0; border-radius: 8px; font-family: "Outfit", sans-serif; font-weight: 600; font-size: 11.5px; color: #fff; background: linear-gradient(135deg, var(--primary), var(--accent)); cursor: pointer; transition: all 0.2s; }
    .actions button:hover { filter: brightness(1.08); }
    .actions button.del { background: linear-gradient(135deg, #dc2626, #f43f5e); }
    .actions button.copied { background: linear-gradient(135deg, #059669, #10b981); }

    .empty { color: var(--text-faint); font-size: 14px; text-align: center; padding: 56px 0; }
    .empty svg { width: 42px; height: 42px; stroke: var(--text-faint); stroke-width: 1.5; fill: none; margin-bottom: 12px; opacity: 0.5; }
    .skeleton-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
    .skeleton-item { border: 1px solid var(--panel-border); border-radius: 14px; overflow: hidden; }
    .skeleton-thumb { height: 118px; background: var(--skeleton); animation: pulse 1.4s ease-in-out infinite; }
    .skeleton-line { height: 9px; margin: 11px; border-radius: 5px; background: var(--skeleton); animation: pulse 1.4s ease-in-out infinite; }
    .skeleton-line.short { width: 55%; margin-top: 0; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; margin-top: 4px; border-top: 1px solid var(--panel-border); flex-wrap: wrap; }
    .pager-info { font-size: 12.5px; color: var(--text-muted); font-family: "JetBrains Mono", monospace; }
    .pager-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .page-btn { min-width: 34px; height: 34px; padding: 0 10px; border: 1px solid var(--panel-border); border-radius: 9px; background: var(--input-bg); color: var(--text); font-family: "Outfit", sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; }
    .page-btn:hover:not(:disabled):not(.active) { border-color: var(--primary); color: var(--primary); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-btn.active { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border-color: transparent; }
    .page-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .page-dots { color: var(--text-faint); padding: 0 2px; font-size: 13px; }

    .footer { margin-top: 28px; text-align: center; color: var(--text-faint); font-size: 12.5px; }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .hero, .login-card, .toolbar, .grid-panel { background: var(--bg); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    @media (max-width: 1100px) {
      .grid, .skeleton-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 860px) {
      .grid, .skeleton-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .shell { padding: 14px 0 32px; }
      .header { flex-wrap: wrap; gap: 10px; }
      .header-right { width: 100%; justify-content: flex-end; }
      .user-name { display: none; }
      .hero { padding: 26px 22px; border-radius: 20px; }
      .login-card { padding: 26px 22px; }
      .toolbar { padding: 14px; gap: 10px; }
      .search-box { min-width: 100%; }
      .toolbar-group { width: 100%; }
      .toolbar-group .btn { flex: 1; }
      .grid-panel { padding: 14px; }
      .grid, .skeleton-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .pager { padding: 14px 0 0; }
      .pager-controls { width: 100%; justify-content: center; }
      body { background-attachment: scroll; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="header-left">
        <div class="brand">
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#14b8a6" />
                <stop offset="100%" stop-color="#0891b2" />
              </linearGradient>
            </defs>
            <path fill="url(#logoGrad)" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" />
          </svg>
          <span class="eyebrow">Image Admin</span>
        </div>
        <div class="user-chip hidden" id="userChip">
          <div class="avatar" id="avatar">A</div>
          <div class="user-name" id="userName"></div>
        </div>
      </div>
      <div class="header-right">
        <div class="toolbar-group hidden" id="loggedActions">
          <button class="btn btn-ghost btn-icon" id="refreshBtn" type="button" title="刷新列表" aria-label="刷新列表">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" /><path d="M21 3v5h-5" /></svg>
          </button>
          <button class="btn btn-ghost" id="logoutBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="M16 17l5-5-5-5" /><path d="M21 12H9" /></svg>
            <span>退出</span>
          </button>
        </div>
        <button id="themeToggle" class="icon-btn" aria-label="切换主题" title="单击切换日间夜间模式，双击恢复跟随系统">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="hero" id="hero">
        <h1>图床管理</h1>
        <p class="lead">查看 Blob 存储中的全部图片，支持搜索、复制直链与批量删除。删除操作不可恢复，请谨慎处理。</p>
      </section>

      <div class="login-wrap" id="loginWrap">
        <section class="login-card">
          <div class="login-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
          </div>
          <div class="login-title">登录管理后台</div>
          <div class="login-sub">请输入服务端环境变量中配置的账号与密码</div>
          <div class="field">
            <label for="usernameInput">账号</label>
            <input type="text" id="usernameInput" autocomplete="username" placeholder="请输入账号" />
          </div>
          <div class="field">
            <label for="passwordInput">密码</label>
            <input type="password" id="passwordInput" autocomplete="current-password" placeholder="请输入密码" />
          </div>
          <button class="btn" id="loginBtn" type="button" style="width:100%;margin-top:6px">
            <span>进入管理</span>
          </button>
          <div class="error-banner" id="errorBanner"></div>
        </section>
      </div>

      <section class="hidden" id="manageCard">
        <div class="toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="M21 21l-4.35-4.35" /></svg>
            <input type="text" id="searchInput" placeholder="搜索文件名" />
          </div>
          <div class="toolbar-group">
            <label class="check-label">
              <input type="checkbox" id="selectAll" />
              <span>全选本页</span>
            </label>
            <button class="btn btn-danger" id="batchDeleteBtn" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /></svg>
              <span>删除所选</span>
            </button>
          </div>
          <div class="stat-line" id="statLine"></div>
        </div>

        <div class="grid-panel">
          <div id="gridBox"></div>

          <div class="pager" id="pager">
            <div class="pager-info" id="pagerInfo"></div>
            <div class="pager-controls" id="pagerControls"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer" id="footer">
      <p>Powered by Tencent Cloud EdgeOne</p>
    </footer>
  </div>

  <script>
    const SESSION_KEY = "imgbed_admin_session";

    document.getElementById("themeToggle").addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    });

    const hero = document.getElementById("hero");
    const loginWrap = document.getElementById("loginWrap");
    const usernameInput = document.getElementById("usernameInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const errorBanner = document.getElementById("errorBanner");
    const userChip = document.getElementById("userChip");
    const userName = document.getElementById("userName");
    const avatar = document.getElementById("avatar");
    const loggedActions = document.getElementById("loggedActions");
    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const manageCard = document.getElementById("manageCard");
    const gridBox = document.getElementById("gridBox");
    const statLine = document.getElementById("statLine");
    const searchInput = document.getElementById("searchInput");
    const selectAll = document.getElementById("selectAll");
    const batchDeleteBtn = document.getElementById("batchDeleteBtn");
    const pager = document.getElementById("pager");
    const pagerInfo = document.getElementById("pagerInfo");
    const pagerControls = document.getElementById("pagerControls");

    let currentUsername = "";
    let currentPassword = "";
    let fileList = [];
    let selected = new Set();
    let keyword = "";
    let pageSize = 10;
    let currentPage = 1;
    let loading = false;

    function credential() {
      return { username: currentUsername, password: currentPassword };
    }

    function saveSession() {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username: currentUsername, password: currentPassword }));
    }

    function readSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || typeof obj.username !== "string" || typeof obj.password !== "string") return null;
        return obj;
      } catch (e) {
        return null;
      }
    }

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.classList.add("show");
    }

    function clearError() {
      errorBanner.textContent = "";
      errorBanner.classList.remove("show");
    }

    function formatSize(bytes) {
      if (!bytes || bytes <= 0) return "未知";
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / 1024 / 1024).toFixed(2) + " MB";
    }

    function formatTime(name) {
      const m = String(name).match(/^(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
      if (!m) return "";
      return m[2] + "-" + m[3] + " " + m[4] + ":" + m[5];
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:-9999px;opacity:0;";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
      document.body.removeChild(ta);
      return ok ? Promise.resolve() : Promise.reject();
    }

    async function callAdmin(payload) {
      let resp;
      try {
        resp = await fetch("/api/admin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        throw new Error("无法连接 /api/admin 接口，请确认管理函数已部署");
      }
      const text = await resp.text();
      if (!resp.ok) throw new Error("HTTP " + resp.status + "：" + text.slice(0, 160));
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error("响应不是 JSON：" + text.slice(0, 160));
      }
    }

    function filteredFiles() {
      if (!keyword) return fileList;
      const kw = keyword.toLowerCase();
      return fileList.filter(f => f.name.toLowerCase().indexOf(kw) !== -1);
    }

    function totalPages() {
      const total = filteredFiles().length;
      return Math.max(1, Math.ceil(total / pageSize));
    }

    function pageFiles() {
      const list = filteredFiles();
      const start = (currentPage - 1) * pageSize;
      return list.slice(start, start + pageSize);
    }

    function renderSkeleton() {
      gridBox.innerHTML = '<div class="skeleton-grid">' + Array.from({ length: pageSize }).map(() => `
        <div class="skeleton-item">
          <div class="skeleton-thumb"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </div>
      `).join("") + '</div>';
      pager.classList.add("hidden");
    }

    function updateStat() {
      const list = filteredFiles();
      const totalSize = list.reduce((sum, f) => sum + (f.size || 0), 0);
      let text = "共 " + list.length + " 张 · " + formatSize(totalSize);
      if (selected.size > 0) text += " · 已选 " + selected.size;
      statLine.textContent = text;
      batchDeleteBtn.disabled = selected.size === 0;
    }

    function renderPager() {
      const total = filteredFiles().length;
      const pages = totalPages();
      if (total === 0) {
        pager.classList.add("hidden");
        return;
      }
      pager.classList.remove("hidden");

      const start = (currentPage - 1) * pageSize + 1;
      const end = Math.min(currentPage * pageSize, total);
      pagerInfo.textContent = "第 " + start + "-" + end + " 条 / 共 " + total + " 条";

      const parts = [];
      parts.push('<button class="page-btn" data-page="prev"' + (currentPage === 1 ? " disabled" : "") + ' aria-label="上一页"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg></button>');

      const window_ = 2;
      const shown = new Set();
      for (let i = 1; i <= Math.min(window_, pages); i++) shown.add(i);
      for (let i = Math.max(1, pages - window_ + 1); i <= pages; i++) shown.add(i);
      for (let i = currentPage - 1; i <= currentPage + 1; i++) {
        if (i >= 1 && i <= pages) shown.add(i);
      }

      const sorted = Array.from(shown).sort((a, b) => a - b);
      let last = 0;
      sorted.forEach(p => {
        if (p - last > 1) parts.push('<span class="page-dots">…</span>');
        parts.push('<button class="page-btn' + (p === currentPage ? " active" : "") + '" data-page="' + p + '">' + p + '</button>');
        last = p;
      });

      parts.push('<button class="page-btn" data-page="next"' + (currentPage === pages ? " disabled" : "") + ' aria-label="下一页"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg></button>');

      pagerControls.innerHTML = parts.join("");
      pagerControls.querySelectorAll(".page-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const v = btn.dataset.page;
          const pagesNow = totalPages();
          if (v === "prev") {
            if (currentPage > 1) goPage(currentPage - 1);
          } else if (v === "next") {
            if (currentPage < pagesNow) goPage(currentPage + 1);
          } else {
            goPage(parseInt(v, 10));
          }
        });
      });
    }

    function goPage(p) {
      currentPage = p;
      renderGrid();
      const top = manageCard.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({ top: top, behavior: "smooth" });
    }

    function renderGrid() {
      const total = filteredFiles().length;

      if (fileList.length === 0) {
        gridBox.innerHTML = `
          <div class="empty">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2z" /><path d="M8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" /></svg>
            <div>还没有上传任何图片</div>
          </div>`;
        pager.classList.add("hidden");
        updateStat();
        return;
      }

      if (total === 0) {
        gridBox.innerHTML = '<div class="empty">没有匹配「' + keyword + '」的图片</div>';
        pager.classList.add("hidden");
        updateStat();
        return;
      }

      if (currentPage > totalPages()) currentPage = totalPages();
      if (currentPage < 1) currentPage = 1;

      const list = pageFiles();

      gridBox.innerHTML = '<div class="grid">' + list.map(f => {
        const isSel = selected.has(f.key);
        return `
        <div class="item${isSel ? " selected" : ""}" data-key="${f.key}">
          <input type="checkbox" class="check" data-action="check" data-key="${f.key}"${isSel ? " checked" : ""} aria-label="选择" />
          <div class="thumb-wrap" data-action="preview" data-key="${f.key}">
            <img class="thumb" src="/img/${f.name}" alt="${f.name}" loading="lazy" />
            <div class="overlay"><span>点击预览</span></div>
          </div>
          <div class="meta">
            <div class="name">${f.name}</div>
            <div class="sub">
              <span>${formatSize(f.size)}</span>
              <span>${formatTime(f.name)}</span>
            </div>
          </div>
          <div class="actions">
            <button type="button" data-action="copy" data-key="${f.key}">复制</button>
            <button type="button" class="del" data-action="delete" data-key="${f.key}">删除</button>
          </div>
        </div>`;
      }).join("") + '</div>';

      gridBox.querySelectorAll("[data-action]").forEach(el => {
        el.addEventListener("click", () => {
          const key = el.dataset.key;
          const action = el.dataset.action;
          const file = fileList.find(f => f.key === key);
          if (!file) return;

          if (action === "check") {
            if (el.checked) selected.add(key);
            else selected.delete(key);
            const card = gridBox.querySelector('.item[data-key="' + key + '"]');
            if (card) card.classList.toggle("selected", el.checked);
            updateStat();
          } else if (action === "preview") {
            window.open(location.origin + "/img/" + file.name, "_blank");
          } else if (action === "copy") {
            copyText(location.origin + "/img/" + file.name).then(() => {
              el.classList.add("copied");
              el.textContent = "已复制";
              setTimeout(() => { el.classList.remove("copied"); el.textContent = "复制"; }, 1500);
            });
          } else if (action === "delete") {
            handleDelete(file, el);
          }
        });
      });

      const pageKeys = new Set(list.map(f => f.key));
      const allChecked = list.length > 0 && list.every(f => selected.has(f.key));
      selectAll.checked = allChecked;
      selectAll.indeterminate = !allChecked && list.some(f => selected.has(f.key));
      void pageKeys;

      renderPager();
      updateStat();
    }

    async function loadFiles() {
      if (loading) return;
      loading = true;
      renderSkeleton();

      let data;
      try {
        data = await callAdmin(Object.assign(credential(), { action: "list" }));
      } catch (e) {
        loading = false;
        showError(e && e.message ? e.message : "加载失败");
        gridBox.innerHTML = '<div class="empty">加载失败</div>';
        return;
      }

      loading = false;

      if (!data.success) {
        showError(data.error || "加载失败");
        gridBox.innerHTML = '<div class="empty">加载失败</div>';
        if (data.error && data.error.indexOf("错误") !== -1) enterLoggedOut();
        return;
      }

      fileList = data.data.files || [];
      renderGrid();
    }

    async function handleDelete(file, btn) {
      if (!confirm("确定删除 " + file.name + " 吗？删除后不可恢复。")) return;
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = "删除中";

      let data;
      try {
        data = await callAdmin(Object.assign(credential(), { action: "delete", key: file.key }));
      } catch (e) {
        btn.disabled = false;
        btn.textContent = original;
        showError(e && e.message ? e.message : "删除失败");
        return;
      }

      if (data.success) {
        selected.delete(file.key);
        await loadFiles();
      } else {
        btn.disabled = false;
        btn.textContent = original;
        showError(data.error || "删除失败");
      }
    }

    async function handleBatchDelete() {
      const keys = Array.from(selected);
      if (keys.length === 0) return;
      if (!confirm("确定删除选中的 " + keys.length + " 张图片吗？删除后不可恢复。")) return;

      batchDeleteBtn.disabled = true;
      const label = batchDeleteBtn.querySelector("span");
      const original = label.textContent;
      label.textContent = "删除中";

      let fail = 0;
      for (const key of keys) {
        try {
          const data = await callAdmin(Object.assign(credential(), { action: "delete", key: key }));
          if (!data.success) fail++;
        } catch (e) {
          fail++;
        }
      }

      label.textContent = original;
      batchDeleteBtn.disabled = false;
      if (fail > 0) showError("有 " + fail + " 张删除失败，请重试");
      await loadFiles();
    }

    function enterLoggedIn(username, password) {
      currentUsername = username;
      currentPassword = password;
      saveSession();
      clearError();
      hero.classList.add("hidden");
      loginWrap.classList.add("hidden");
      manageCard.classList.remove("hidden");
      userChip.classList.remove("hidden");
      loggedActions.classList.remove("hidden");
      userName.textContent = username;
      avatar.textContent = username.charAt(0);
      document.title = "图床管理 · " + username;
    }

    function enterLoggedOut() {
      currentUsername = "";
      currentPassword = "";
      sessionStorage.removeItem(SESSION_KEY);
      hero.classList.remove("hidden");
      loginWrap.classList.remove("hidden");
      manageCard.classList.add("hidden");
      userChip.classList.add("hidden");
      loggedActions.classList.add("hidden");
      gridBox.innerHTML = "";
      pager.classList.add("hidden");
      fileList = [];
      selected.clear();
      currentPage = 1;
      keyword = "";
      searchInput.value = "";
      passwordInput.value = "";
      document.title = "图床管理";
    }

    loginBtn.addEventListener("click", async () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      if (!username) { showError("请输入账号"); return; }
      if (!password) { showError("请输入密码"); return; }

      clearError();
      loginBtn.disabled = true;
      loginBtn.querySelector("span").textContent = "验证中";

      try {
        const data = await callAdmin({ username, password, action: "list" });
        if (data.success) {
          enterLoggedIn(username, password);
          fileList = data.data.files || [];
          currentPage = 1;
          renderGrid();
        } else {
          showError(data.error || "账号或密码错误");
        }
      } catch (e) {
        showError(e && e.message ? e.message : "请求失败");
      }

      loginBtn.disabled = false;
      loginBtn.querySelector("span").textContent = "进入管理";
    });

    usernameInput.addEventListener("keydown", e => { if (e.key === "Enter") loginBtn.click(); });
    passwordInput.addEventListener("keydown", e => { if (e.key === "Enter") loginBtn.click(); });

    refreshBtn.addEventListener("click", () => {
      currentPage = 1;
      loadFiles();
    });

    logoutBtn.addEventListener("click", () => {
      if (confirm("确定退出登录吗？")) enterLoggedOut();
    });

    searchInput.addEventListener("input", () => {
      keyword = searchInput.value.trim();
      currentPage = 1;
      renderGrid();
    });

    selectAll.addEventListener("change", () => {
      const list = pageFiles();
      if (selectAll.checked) list.forEach(f => selected.add(f.key));
      else list.forEach(f => selected.delete(f.key));
      renderGrid();
    });

    batchDeleteBtn.addEventListener("click", handleBatchDelete);

    (function init() {
      const session = readSession();
      if (session && session.username && session.password) {
        enterLoggedIn(session.username, session.password);
        usernameInput.value = session.username;
        loadFiles();
      }
    })();
  </script>
</body>
</html>
